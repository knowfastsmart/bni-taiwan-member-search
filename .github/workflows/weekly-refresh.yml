name: Weekly BNI Taiwan refresh

on:
  schedule:
    # Monday 06:20 Asia/Taipei = Sunday 22:20 UTC
    - cron: '20 22 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/weekly-refresh.yml'

permissions:
  contents: read

concurrency:
  group: bni-refresh-and-pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check out reviewed upstream crawler
        uses: actions/checkout@v4
        with:
          repository: gaskhuang/bni-crawler
          ref: cc7c982457a1bf8406aeeb8b982df49c6224045b
          path: upstream-crawler
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-refresh.txt
      - run: python -m pip install -r requirements-refresh.txt
      - run: python -m unittest -v test_refresh.py
      - name: Fetch Taiwan members and validate snapshot
        run: python refresh_members.py --crawler-dir upstream-crawler --concurrency 8
      - name: Commit validated database and website data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/members.csv data/metadata.json docs/members.js
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Taiwan BNI members $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi

  deploy:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish updated search website
        id: deployment
        uses: actions/deploy-pages@v5
